<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richieste e Contatti - Calcio & Passione</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER E MENU -->
  <header>
    <div class="header-container">
      <h1>Calcio & Passione</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="serie-a.html">Serie A</a>
        <a href="juventus.html">Juventus</a>
        <a href="form.html" class="active">Contatti</a>
        <a href="donazioni.html" class="active">Sostieni</a>
        <button id="theme-toggle">🌙 Tema</button>
      </nav>
    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="container">
    <section class="form-section">
      <h2>Lascia un messaggio o fai una richiesta</h2>
      <p>Hai un'idea per un articolo? Vuoi commentare un'analisi tattica o proporre un argomento? Compila il modulo qui sotto!</p>

      <!-- FORM DI CONTATTO (Sostituisci tuaemail@email.com con la tua email reale) -->
      <form action="https://formsubmit.co/dblvlr1@gmail.com" method="POST" class="contact-form">
        
        <!-- Disattiva il Captcha automatico per facilitare l'invio (opzionale) -->
        <input type="hidden" name="_captcha" value="false">
        <!-- Reindirizzamento o conferma dopo l'invio -->
        <input type="hidden" name="_subject" value="Nuovo messaggio dal Blog Calcio & Passione!">

        <div class="form-group">
          <label for="nome">Nome o Nickname *</label>
          <input type="text" id="nome" name="nome" placeholder="Il tuo nome" required>
        </div>

        <div class="form-group">
          <label for="email">La tua Email *</label>
          <input type="email" id="email" name="email" placeholder="nome@esempio.com" required>
        </div>

        <div class="form-group">
          <label for="argomento">Tipo di Richiesta</label>
          <select id="argomento" name="argomento">
            <option value="suggerimento">Suggerimento per un articolo</option>
            <option value="juventus">Richiesta Focus Juventus</option>
            <option value="serie-a">Commento Serie A</option>
            <option value="altro">Altro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="messaggio">Messaggio *</label>
          <textarea id="messaggio" name="messaggio" rows="5" placeholder="Scrivi qui il tuo messaggio..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Invia Richiesta 🚀</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
  <button id="back-to-top" aria-label="Torna in alto">⬆</button>
</body>
</html>
